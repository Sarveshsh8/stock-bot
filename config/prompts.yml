# Stock Analysis Prompts Configuration

# Data Collection Prompts
data_collection:
  summary: "Collecting comprehensive stock data for analysis"
  progress: "Collected {data_points} {interval} data points for {symbol}"
  completion: "Data collection completed for {symbol}"

# Excel Report Prompts
excel_report:
  summary_sheet: "Creating executive summary sheet"
  data_sheets: "Creating data sheets with formatted columns"
  technical_analysis: "Adding technical analysis sheet"

# Chart Generation Prompts
chart_generation:
  price_chart: "Creating price chart with volume analysis"
  daily_trend: "Creating daily trend chart with moving averages"
  technical_indicators: "Adding technical indicators to charts"

# Video Creation Prompts
video_creation:
  slideshow: "Creating slideshow from generated charts"
  transition: "Adding smooth transitions between charts"
  final_video: "Finalizing video with annotations"

# Multimodal Analysis Prompts
multimodal_analysis:
  image_analysis: |
    Analyze the following stock chart image for {symbol}:
    
    Chart Information:
    - Chart Type: {chart_type}
    - Time Period: {time_period}
    - Current Price: ${current_price:.2f}
    - Price Change: {change_percent:.2f}%
    
    Please provide:
    1. Chart pattern analysis
    2. Key support and resistance levels
    3. Trend direction and strength
    4. Volume analysis
    5. Technical indicators visible
    6. Trading signals
    7. Risk assessment

  video_analysis: |
    Analyze the following stock analysis video for {symbol}:
    
    Video Content:
    - Number of charts: {chart_count}
    - Chart types: {chart_types}
    - Time period: {time_period}
    - Current price: ${current_price:.2f}
    
    Please provide:
    1. Overall market analysis
    2. Key patterns across charts
    3. Trend consistency
    4. Volume patterns
    5. Technical signals
    6. Trading recommendations
    7. Risk factors

# FAISS Index Prompts
faiss_index:
  document_creation: "Creating documents for FAISS indexing"
  index_building: "Building FAISS index from documents"
  index_saving: "Saving FAISS index to disk"

# Q&A System Prompts
qa_system:
  query_processing: "Processing user query"
  similarity_search: "Performing similarity search"
  answer_generation: "Generating answer from indexed data"

# Error Messages
errors:
  data_collection: "Error collecting data for {symbol}: {error}"
  excel_report: "Error creating Excel report: {error}"
  chart_generation: "Error creating charts: {error}"
  video_creation: "Error creating video: {error}"
  multimodal_analysis: "Error in multimodal analysis: {error}"
  faiss_index: "Error building FAISS index: {error}"
  qa_system: "Error in Q&A system: {error}"

# Success Messages
success:
  data_collection: "Data collection completed for {symbol}"
  excel_report: "Excel report created successfully"
  chart_generation: "Charts created successfully"
  video_creation: "Video created successfully"
  multimodal_analysis: "Multimodal analysis completed successfully"
  faiss_index: "FAISS index built successfully"
  qa_system: "Q&A system ready"
