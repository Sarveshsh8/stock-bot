apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-stock-bot
  namespace: stock-bot
  labels:
    app: jupyter-stock-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-stock-bot
  template:
    metadata:
      labels:
        app: jupyter-stock-bot
    spec:
      containers:
      - name: jupyter-stock-bot
        image: jupyter/minimal-notebook:latest
        ports:
        - containerPort: 8888
          name: jupyter
        env:
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: JUPYTER_TOKEN
          value: "stock-bot-jupyter-2024"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: stock-bot-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: stock-bot-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: stock-bot-secrets
              key: S3_BUCKET_NAME
        - name: AWS_DEFAULT_REGION
          valueFrom:
            configMapKeyRef:
              name: stock-bot-config
              key: AWS_DEFAULT_REGION
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONPATH
          value: "/home/jovyan/work:/home/jovyan/work/src"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /lab
            port: 8888
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /lab
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      # imagePullSecrets:
      # - name: ecr-secret
