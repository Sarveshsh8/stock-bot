apiVersion: v1
kind: PersistentVolume
metadata:
  name: jupyter-custom-deps-pv
  namespace: stock-bot
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    path: /tmp/jupyter-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-custom-deps-pvc
  namespace: stock-bot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: hostpath

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-custom-deps
  namespace: stock-bot
  labels:
    app: jupyter-custom-deps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-custom-deps
  template:
    metadata:
      labels:
        app: jupyter-custom-deps
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          mkdir -p /home/jovyan/work
          chown -R 1000:100 /home/jovyan/work
          chmod -R 755 /home/jovyan/work
        volumeMounts:
        - name: persistent-storage
          mountPath: /home/jovyan/work
        securityContext:
          runAsUser: 0
      containers:
      - name: jupyter
        image: 295386645352.dkr.ecr.us-east-1.amazonaws.com/stock-bot-jupyter:custom
        ports:
        - containerPort: 8888
        env:
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        - name: JUPYTER_TOKEN
          value: "stock-bot-jupyter-2024"
        - name: PYTHONPATH
          value: "/home/jovyan/work:/home/jovyan/work/src"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: persistent-storage
          mountPath: /home/jovyan/work
        livenessProbe:
          httpGet:
            path: /lab
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /lab
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
      volumes:
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: jupyter-custom-deps-pvc
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-custom-deps-service
  namespace: stock-bot
spec:
  selector:
    app: jupyter-custom-deps
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8888
  type: LoadBalancer
