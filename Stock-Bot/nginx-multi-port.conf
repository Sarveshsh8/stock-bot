events {
    worker_connections 1024;
}

http {
    server {
        listen 8501;
        location / {
            return 200 'Streamlit Service - Port 8501\n';
            add_header Content-Type text/plain;
        }
    }
    
    server {
        listen 5001;
        location / {
            return 200 'Flask API Service - Port 5001\n';
            add_header Content-Type text/plain;
        }
    }
}
