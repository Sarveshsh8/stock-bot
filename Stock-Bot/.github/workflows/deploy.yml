name: Deploy to AWS EKS

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ dev ]

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: stock-bot
  EKS_CLUSTER: stock-bot-cluster
  KUBE_NAMESPACE: stock-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        # Add your test commands here
        echo "Running tests..."
        # python -m pytest tests/

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push images to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build main application docker container and push it to ECR
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # Build Jupyter docker container and push it to ECR
        docker build -f Dockerfile.jupyter -t $ECR_REGISTRY/$ECR_REPOSITORY-jupyter:$IMAGE_TAG .
        docker build -f Dockerfile.jupyter -t $ECR_REGISTRY/$ECR_REPOSITORY-jupyter:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY-jupyter:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY-jupyter:latest
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "jupyter_image=$ECR_REGISTRY/$ECR_REPOSITORY-jupyter:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
    - name: Download kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}
    
    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Update the deployment with the new image
        sed -i "s|stock-bot:latest|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s/deployment.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secrets.yaml
        kubectl apply -f k8s/persistent-volume.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        
        # Deploy Jupyter Lab
        kubectl apply -f k8s/jupyter-pvc.yaml
        sed -i "s|stock-bot-jupyter:latest|$ECR_REGISTRY/$ECR_REPOSITORY-jupyter:$IMAGE_TAG|g" k8s/jupyter-custom-deployment.yaml
        kubectl apply -f k8s/jupyter-custom-deployment.yaml
        kubectl apply -f k8s/jupyter-service.yaml
        kubectl apply -f k8s/jupyter-ingress.yaml
        
        # Wait for deployments to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/stock-bot-app -n ${{ env.KUBE_NAMESPACE }}
        kubectl wait --for=condition=available --timeout=300s deployment/jupyter-stock-bot -n ${{ env.KUBE_NAMESPACE }}
    
    - name: Get deployment status
      run: |
        kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
        kubectl get services -n ${{ env.KUBE_NAMESPACE }}
        kubectl get ingress -n ${{ env.KUBE_NAMESPACE }}
