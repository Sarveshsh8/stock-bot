version: '3.8'

services:
  stock-bot:
    build: .
    container_name: stock-bot-app
    ports:
      - "8501:8501"  # Streamlit
      - "5001:5001"  # Flask API
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./indices:/app/indices
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - stock-bot-network

  # Optional: Redis for caching (if needed later)
  # redis:
  #   image: redis:7-alpine
  #   container_name: stock-bot-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
  #   networks:
  #     - stock-bot-network

networks:
  stock-bot-network:
    driver: bridge

volumes:
  stock-bot-data:
  stock-bot-indices:
  stock-bot-logs:
