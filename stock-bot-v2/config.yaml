# ETF and Stock Data Fetcher Configuration
# Add or remove ETF/Stock symbols as needed
# Only symbols listed below will be fetched

# Exchange Traded Funds (ETFs)
etfs:
  # Major Market ETFs
  - symbol: "SPY"
    name: "SPDR S&P 500 ETF Trust"
    category: "US Large Cap"
    
  # - symbol: "QQQ"
  #   name: "Invesco QQQ Trust"
