apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-bot-v3-config
  namespace: stock-bot-v3
data:
  config.yaml: |
    # Stock Bot V3 - Unified Configuration
    etfs:
      - symbol: "SPY"
        name: "SPDR S&P 500 ETF Trust"
        category: "US Large Cap"
      - symbol: "QQQ"
        name: "Invesco QQQ Trust"
        category: "US Technology"
    
    stocks:
      - symbol: "AAPL"
        name: "Apple Inc."
        category: "Technology"
      - symbol: "MSFT"
        name: "Microsoft Corporation"
        category: "Technology"
    
    data_settings:
      default_period_months: 6
      output_directory: "/app/data"
      excel_filename: "financial_data.xlsx"
    
    s3_settings:
      bucket_name: "stock-bot-v3-data"
      region: "us-east-1"
      version_prefix: "v1.0"
    
    faiss_settings:
      model_name: "all-MiniLM-L6-v2"
      index_dimension: 384
      chunk_size: 1000
      overlap_size: 200
    
    bedrock_settings:
      region: "us-east-1"
      nova_pro_arn: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0"
      max_tokens: 4000
