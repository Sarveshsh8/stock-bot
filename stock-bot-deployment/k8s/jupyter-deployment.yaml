apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-bot-v3-jupyter
  namespace: stock-bot-v3
  labels:
    app: stock-bot-v3-jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-bot-v3-jupyter
  template:
    metadata:
      labels:
        app: stock-bot-v3-jupyter
    spec:
      serviceAccountName: stock-bot-v3-sa
      containers:
      - name: jupyter
        image: 295386645352.dkr.ecr.us-east-1.amazonaws.com/stock-bot-v3:latest
        command: ["python3", "-m", "jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=''", "--NotebookApp.password=''"]
        ports:
        - containerPort: 8888
          name: jupyter
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: aws-secret-access-key
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: aws-secrets
              key: s3-bucket-name
        - name: JUPYTER_ENABLE_LAB
          value: "yes"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: data-volume
          mountPath: /app/data
        - name: notebook-volume
          mountPath: /app/notebooks
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: stock-bot-v3-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: stock-bot-v3-pvc
      - name: notebook-volume
        persistentVolumeClaim:
          claimName: stock-bot-v3-jupyter-pvc
