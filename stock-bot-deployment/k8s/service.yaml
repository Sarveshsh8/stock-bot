apiVersion: v1
kind: Service
metadata:
  name: stock-bot-v3-service
  namespace: stock-bot-v3
  labels:
    app: stock-bot-v3
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8501
    protocol: TCP
    name: streamlit
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: flask
  selector:
    app: stock-bot-v3
