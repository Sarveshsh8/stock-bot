version: '3.8'

services:
  stock-bot-v3:
    build: .
    command: ["python", "-m", "streamlit", "run", "web_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8502:8501"  # Streamlit
      - "5002:5000"  # Flask API
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    volumes:
      - ./data:/app/data
      - ./indices:/app/indices
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
